
{% extends "base.html" %}

{% block title %}Scan Product | PackSure{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <span class="eyebrow">INSPECTION</span>

        <h1>Scan Product</h1>

        <p>
            Upload a packaged commodity image for compliance analysis.
        </p>
    </div>

</div>


<div class="panel scan-panel">

    <div class="panel-header">

        <div>
            <h2>Product Inspection</h2>

            <p>
                Upload a clear image of the package label.
            </p>
        </div>

    </div>


    <form method="POST"
          enctype="multipart/form-data"
          id="inspectionForm">

        {% csrf_token %}


        <!-- Product Name -->

        <div class="form-group">

            <label for="product_name">
                Product Name
            </label>

            <input
                type="text"
                id="product_name"
                name="product_name"
                placeholder="Example: Tata Salt"
                required
            >

        </div>


        <!-- Image Upload -->

        <div class="form-group">

            <label>
                Product Image
            </label>

            <label for="product_image" class="upload-box">

                <div class="upload-icon">
                    ↑
                </div>

                <strong>
                    Click to upload product image
                </strong>

                <span>
                    PNG, JPG or JPEG
                </span>

                <input
                    type="file"
                    id="product_image"
                    name="image"
                    accept="image/png,image/jpeg,image/jpg"
                    required
                    hidden
                >

            </label>

        </div>


        <!-- Image Preview -->

        <div id="preview-container" class="preview-container">

            <p>Image Preview</p>

            <img id="image-preview" alt="Product preview">

        </div>


        <!-- Start Inspection -->

        <button
            type="submit"
            class="primary-btn inspection-btn">

            Start Inspection →

        </button>

    </form>

</div>

{% endblock %}
